 <div class="card"><div class="eyebrow">ЮБИЛЕЙ 50 ЛЕТ</div><h2>Почти готово!</h2><div class="rule"></div><p>Укажите имя и фамилию<br>и проверьте ответы.</p>

</main><script>
let state={attend:'',count:1,drinks:[]};const labels=['Шампанское / игристое','Белое вино','Красное вино','Виски','Коньяк','Джин','Водка','Без алкоголя'];
const S=n=>document.getElementById('p'+n);
function zone(n,x,y,w,h,fn,label){const f=S(n).querySelector('.frame'),b=document.createElement('button');b.className='tap';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',label);b.onclick=fn;f.append(b);return b}
zone(1,19.73,90.76,60.45,4.82,()=>show(2),'Открыть приглашение');
zone(1,66.5,79.8,30,9.8,()=>show(8,1),'Схема проезда: ЦМТ, подъезд № 10');
zone(2,29.7,84.4,40.6,4.36,()=>show(3),'Продолжить');
zone(3,29.7,92.97,40.6,4.36,()=>show(4),'Продолжить');
zone(4,19.73,39.84,60.45,9.83,()=>attendance('Да, приду'),'Да, приду');zone(4,19.73,51.17,60.45,9.96,()=>attendance('Пока не знаю'),'Пока не знаю');zone(4,19.73,62.70,60.45,9.90,()=>attendance('К сожалению, не смогу'),'Не смогу');
function attendance(v){state.attend=v;show(v==='К сожалению, не смогу'?7:5)}
zone(5,17.68,47.53,64.94,10.48,()=>{state.count=1;show(6)},'Приду один');zone(5,17.68,59.51,64.94,10.61,()=>{state.count=2;show(6)},'Придём вдвоём');
const positions=[[12.30,39.71,9.38],[50.68,39.71,9.38],[12.30,50.13,9.44],[50.68,50.13,9.44],[12.30,60.55,9.11],[50.68,60.55,9.11],[12.30,70.51,9.05],[50.68,70.51,9.05]];
positions.forEach(([x,y,h],i)=>zone(6,x,y,37.01,h,()=>{const label=labels[i];if(i===7){state.drinks=state.drinks.includes(label)?[]:[label]}else{state.drinks=state.drinks.filter(v=>v!==labels[7]);state.drinks=state.drinks.includes(label)?state.drinks.filter(v=>v!==label):[...state.drinks,label]}drawChecks()},labels[i]));
zone(6,26.66,82.88,47.46,5.21,()=>show(7),'Продолжить');
function drawChecks(){const f=S(6).querySelector('.frame');f.querySelectorAll('.check').forEach(n=>n.remove());state.drinks.forEach(v=>{const i=labels.indexOf(v),[x,y,h]=positions[i],c=document.createElement('div');c.className='check';c.style.cssText=`left:${x}%;top:${y}%;width:37.01%;height:${h}%`;f.append(c)})}
let currentPage=1,prevPage=1;
function goBack(){if(currentPage===8)show(prevPage);else if(currentPage===9)show(7);else if(currentPage>1)show(currentPage-1)}
function show(n,from){if(n===8)prevPage=from||currentPage;currentPage=n;document.querySelectorAll('main > section').forEach(x=>x.classList.remove('active'));S(n).classList.add('active');document.getElementById('backNav').hidden=(n===1);
 if(n===7){document.getElementById('a').textContent=state.attend||'Не выбрано';document.getElementById('c').textContent=state.attend==='К сожалению, не смогу'?'—':state.count;document.getElementById('d').textContent=state.drinks.join(', ')||'—'}
 window.scrollTo(0,0);const sc=S(n);if(sc.scrollTo)sc.scrollTo(0,0)}
function message(){return `Юбилей Андрея Белинского — 21 декабря 2026\nИмя: ${first.value.trim()} ${last.value.trim()}\nПрисутствие: ${state.attend}\nКоличество гостей: ${state.attend==='К сожалению, не смогу'?'0':state.count}\nНапитки: ${state.drinks.join(', ')||'не указаны'}`}
const CFG=window.INVITE_CONFIG||{},TX=CFG.TEXT||{};
const base=()=>String(CFG.ENDPOINT||'').replace(/\/+$/,'');
let lastAnswer=null,sending=false;
function anonId(){let v=null;try{v=localStorage.getItem('invite:anon-id')}catch(e){}if(!v){v='open-'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('invite:anon-id',v)}catch(e){}}return v}
const q=new URLSearchParams(location.search);const guestId=(q.get('g')||'').trim().slice(0,64).replace(/[^\w\-.]/g,'');let guest=null;
if(q.get('debug'))document.body.classList.add('debug');
function fj(url,opts,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||8000);return fetch(url,{...(opts||{}),signal:c.signal}).then(r=>{clearTimeout(t);return r.json().catch(()=>({})).then(j=>({ok:r.ok,status:r.status,json:j}))},e=>{clearTimeout(t);throw e})}
function loadGuest(){if(!guestId)return Promise.resolve(null);const done=g=>{guest=g;if(g){if(g.first&&!first.value)first.value=g.first;if(g.last&&!last.value)last.value=g.last}return g};
 if(base())return fj(base()+'/guest?g='+encodeURIComponent(guestId),{},6000).then(r=>done(r.ok&&r.json&&r.json.guest||null),()=>null);
 return fj(CFG.GUESTS_URL||'guests.json',{cache:'no-cache'},6000).then(r=>{const l=Array.isArray(r.json)?r.json:(r.json&&r.json.guests)||[];return done(l.find(x=>x.id===guestId)||null)},()=>null)}
loadGuest();
const ATT={'Да, приду':'yes','Пока не знаю':'maybe','К сожалению, не смогу':'no'};
function buildAnswer(){const no=state.attend==='К сожалению, не смогу';return{guestId:guest?guest.id:(guestId||anonId()),known:!!guest,first:first.value.trim(),last:last.value.trim(),attend:ATT[state.attend],count:no?0:state.count,drinks:no?[]:state.drinks.slice(),comment:'',website:''}}
/* Успех только при ответе сервера 2xx и {ok:true}. Пустой ENDPOINT: успех только в DEMO. */
function send(a){if(!base())return CFG.DEMO===true?Promise.resolve({demo:true}):Promise.reject({code:'no_endpoint'});
 return fj(base()+'/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)},12000).then(r=>{if(r.ok&&r.json&&r.json.ok===true)return r.json;throw{code:'server',status:r.status}},e=>{throw e&&e.code?e:{code:'network'}})}
function retrySend(){thRetry.disabled=true;thRetry.textContent='Отправляем…';const done=()=>{thRetry.disabled=false;thRetry.textContent='Отправить ответ'};send(lastAnswer).then(r=>{done();showThanks(true,!!r.demo)},()=>{done();showThanks(false)})}
function confirmAnswer(){if(!first.value.trim()||!last.value.trim()){alert('Пожалуйста, укажите имя и фамилию');return}if(!state.attend){alert('Пожалуйста, выберите, придёте ли вы');show(4);return}lastAnswer=buildAnswer();const btn=document.getElementById('confirmBtn');btn.disabled=true;const old=btn.textContent;btn.textContent='Отправляем…';send(lastAnswer).then(r=>{btn.disabled=false;btn.textContent=old;try{localStorage.setItem('birthday_rsvp',JSON.stringify(lastAnswer))}catch(e){}showThanks(true,!!r.demo)},()=>{btn.disabled=false;btn.textContent=old;showThanks(false)})}
async function shareAnswer(){const t=message();if(navigator.share){try{await navigator.share({title:'Ответ на приглашение',text:t});return}catch(e){}}try{await navigator.clipboard.writeText(t);alert('Ответ скопирован. Вставьте его в сообщение Андрею и отправьте.')}catch(e){prompt('Скопируйте ответ:',t)}}
function calendar(){const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Birthday Invite//RU','BEGIN:VEVENT','UID:andrey50-20261221@invitation','DTSTAMP:20261029T090000Z','DTSTART:20261221T143000Z','DTEND:20261221T200000Z','SUMMARY:Юбилей Андрея Белинского — 50 лет','LOCATION:ЦМТ, Краснопресненская наб. 12, зал Дорчестер, подъезд 10','DESCRIPTION:Сбор гостей 17:30, банкет 18:00','END:VEVENT','END:VCALENDAR'].join('\r\n')+'\r\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/calendar;charset=utf-8'}));a.download='yubiley-andreya-21-dekabrya.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
show(1);
function showThanks(ok,demo){const t=S(9);thH.textContent=ok?TX.okTitle:TX.errTitle;thP.textContent=ok?TX.okText:TX.errText;document.getElementById('demoTag').hidden=!(ok&&demo);
 thRetry.hidden=ok;thCopy.hidden=ok;thCal.hidden=!ok;show(9)}
show(1);
